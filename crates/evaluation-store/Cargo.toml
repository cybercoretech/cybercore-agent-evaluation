[package]
name = "cybercore-evaluation-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Local persistence for the CyberCore Agent Evaluation Workbench: SQLite metadata store and filesystem evidence store."

[dependencies]
cybercore-evaluation-core = { path = "../evaluation-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jsonschema = { version = "0.61.2", default-features = false }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt", "time"] }
