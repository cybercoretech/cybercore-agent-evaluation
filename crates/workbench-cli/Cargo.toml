[package]
name = "cybercore-workbench-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "workbench: run and inspect local CyberCore agent evaluations."

[[bin]]
name = "workbench"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
cybercore-evaluation-core = { path = "../evaluation-core" }
cybercore-evaluation-judge = { path = "../evaluation-judge" }
cybercore-evaluation-store = { path = "../evaluation-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "rt"] }
