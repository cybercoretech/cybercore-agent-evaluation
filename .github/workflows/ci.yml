name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Contracts and Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: pip install -r requirements-contracts.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contracts/conformance/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust workspace tests (core, store, conformance)
        run: cargo test --workspace --locked
      - name: Python, TypeScript and Rust contract conformance + core tests
        run: bash scripts/validate_all_contracts.sh
  sandbox:
    name: Bubblewrap sandbox (real execution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces on this throwaway runner
        # Ubuntu 24.04 restricts them through AppArmor by default; Bubblewrap needs them.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 /usr/bin/true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Local process runner smoke test
        run: cargo run --locked -p cybercore-evaluation-core --example local_process_runner_smoke
      - name: Durable evaluation demo (crash, then resume)
        run: |
          set -o pipefail
          dir="$RUNNER_TEMP/durable-demo"
          if cargo run --locked -q -p cybercore-evaluation-store --example durable_evaluation -- "$dir" --crash-after 2; then
            echo "expected the simulated crash to exit non-zero" >&2; exit 1
          fi
          cargo run --locked -q -p cybercore-evaluation-store --example durable_evaluation -- "$dir" | tee "$RUNNER_TEMP/resume.txt"
          grep -q 'interrupted attempts: \["REQ-TRIAL-3-A1"\]' "$RUNNER_TEMP/resume.txt"
          grep -q 'RUN-TRIAL-4-A1 .*verified_fail' "$RUNNER_TEMP/resume.txt"
      - name: Workspace output collection and workbench CLI in the real sandbox (skips are failures here)
        env:
          WORKBENCH_REQUIRE_BWRAP: "1"
        run: |
          cargo test --locked -p cybercore-evaluation-core --test workspace_outputs_bwrap -- --nocapture
          cargo test --locked -p cybercore-workbench-cli --test cli -- --nocapture
  container:
    name: Podman container runner (real execution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Give the runner user a systemd session with delegated cgroup controllers
        # Rootless Podman applies memory/CPU/pids limits only through a user
        # systemd manager that owns delegated controllers. Without them the
        # container runner refuses to run, so this must succeed for the job to pass.
        run: |
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          sudo systemctl daemon-reload
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo loginctl enable-linger "$USER"
          uid="$(id -u)"
          for _ in $(seq 1 40); do [ -S "/run/user/$uid/bus" ] && break; sleep 0.5; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          cat "/sys/fs/cgroup/user.slice/user-$uid.slice/user@$uid.service/cgroup.controllers"
      - name: Pull the test image (the runner itself never pulls)
        run: |
          podman --version
          podman info --format 'cgroups={{.Host.CgroupsVersion}} manager={{.Host.CgroupManager}} rootless={{.Host.Security.Rootless}}'
          podman pull docker.io/library/ubuntu:22.04
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Container runner and workbench CLI against real Podman (skips are failures here)
        env:
          WORKBENCH_REQUIRE_PODMAN: "1"
        run: |
          cargo test --locked -p cybercore-evaluation-core --test container_podman -- --nocapture
          cargo test --locked -p cybercore-workbench-cli --test cli -- --nocapture podman_
