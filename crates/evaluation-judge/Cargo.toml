[package]
name = "cybercore-evaluation-judge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Model-judge verifier for the CyberCore Agent Evaluation Workbench (Claude Messages API over HTTP)."

[dependencies]
cybercore-evaluation-core = { path = "../evaluation-core" }
cybercore-evaluation-store = { path = "../evaluation-store" }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.54", features = ["rt"] }
ureq = { version = "3.5", features = ["json"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt"] }
